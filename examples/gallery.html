<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея стилей для роликов</title>
<style>
  body { margin: 0; padding: 24px 16px 60px; background: #0a0a0f; color: #e8e8f0; font: 15px/1.6 system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { color: #9a9ab8; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #12121a; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; }
  img, video { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #1a1a26; }
  figcaption { padding: 12px 14px; }
  b { color: #00d4aa; font-size: 18px; margin-right: 6px; }
  a { color: #7c6fff; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Выберите стиль для своих роликов</h1>
  <p>Это картинки-образцы (референсы): по ним агент соберёт правила стиля — цвета, шрифты, движение. Назовите агенту 2–4 номера, которые нравятся, например: «беру 2, 3 и 6». Картинки берите одного вида — светлые к светлым, тёмные к тёмным. Нужен интернет.</p>
  <div class="grid">
    <figure><img src="https://cdn.dribbble.com/userupload/44577067/file/still-592371d68132015200369ac8ba583b09.png?resize=1600x1200" alt="Небо и стекло"><figcaption><b>1</b>Светлый, воздушный: небо, стекло, мягкий свет<br><a href="https://dribbble.com/shots/26423101-Blue-Glass-Capsule-Animation">открыть на Dribbble</a></figcaption></figure>
    <figure><img src="https://cdn.dribbble.com/userupload/44502000/file/still-b6014b72969c12b6774f77dd36847d44.png?resize=1600x1200" alt="Тёмное стекло"><figcaption><b>2</b>Тёмное стекло и крупное слово — спокойно и дорого<br><a href="https://dribbble.com/shots/26400595-Liquid-Glass-Motion-Clean-Immersive-UI-Design">открыть на Dribbble</a></figcaption></figure>
    <figure><img src="https://cdn.dribbble.com/userupload/48379469/file/eca388d3f9c20a1fdecc4e89fefc4a29.png?crop=240x0-1680x1080&resize=1600x1200" alt="3D-стекло с титрами"><figcaption><b>3</b>Тёмное 3D-стекло с титрами внутри — эффектно<br><a href="https://dribbble.com/shots/27557280-3D-Glass-Shapes-Titles">открыть на Dribbble</a></figcaption></figure>
    <figure><video src="https://cdn.dribbble.com/userupload/43376964/file/small-2bfc71c2a2cc8e8ff7271010486a9869.mp4" poster="https://cdn.dribbble.com/userupload/43376964/file/still-800103819a5f3d0bf7d3fd059b993a55.png?resize=1600x1200" autoplay muted loop playsinline></video><figcaption><b>4</b>Энергичная крупная типографика<br><a href="https://dribbble.com/shots/26044438-Kinetic-Type-Motion">открыть на Dribbble</a></figcaption></figure>
    <figure><video src="https://cdn.dribbble.com/userupload/45408268/file/small-e7dc319141b4c74bef87df5d59c4db29.mp4" poster="https://cdn.dribbble.com/userupload/45408268/file/still-7655b4b130774118714244f566fe4c69.png?resize=1600x1200" autoplay muted loop playsinline></video><figcaption><b>5</b>Минимализм: мягкий цвет и сдержанный текст<br><a href="https://dribbble.com/shots/26680081-Kinetic-Typography-Text-Animations-Minimalistic-Style">открыть на Dribbble</a></figcaption></figure>
    <figure><img src="https://cdn.dribbble.com/userupload/33421751/file/still-d432356d75db34c1b64dff524c59393f.png?resize=1600x1200" alt="Журнальная типографика"><figcaption><b>6</b>Журнальный стиль: чёрный фон, белые широкие буквы<br><a href="https://dribbble.com/shots/16500549-Visvim-Kinetic-Type">открыть на Dribbble</a></figcaption></figure>
  </div>
</div>
