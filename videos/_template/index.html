<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* шрифты — локальные файлы: при рендере сети нет */
      @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2"); font-weight: 500 800;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin.woff2") format("woff2"); font-weight: 500 800;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-cyrillic.woff2") format("woff2"); font-weight: 400 800;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin.woff2") format("woff2"); font-weight: 400 800;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1b24; color: #f3f7fb; }
      #title { position: absolute; left: 84px; right: 84px; top: 820px; font-family: "Unbounded", sans-serif; font-weight: 800;
               font-size: 96px; line-height: 1.05; letter-spacing: -0.02em; text-transform: uppercase; }
      #sub { position: absolute; left: 84px; right: 84px; top: 1060px; font-family: "Manrope", sans-serif; font-weight: 600; font-size: 48px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Первый ролик</h1>
      <p id="sub" class="clip" data-start="0" data-duration="5" data-track-index="1">шаблон работает</p>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.2);
      tl.fromTo("#sub", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
